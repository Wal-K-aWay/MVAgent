runtime:
  output_dir: outputs
  cache_dir: .cache/mvagent
  video_concurrency: 2
models:
  qwen3_5_35b_a3b_local:
    type: local_vllm
    model_name: /home/kww/models/Qwen3.5/Qwen3.5-35B-A3B
    dtype: auto
    gpu_memory_utilization: 0.9
    max_model_len: 262144
    reasoning_parser: qwen3
    enable_thinking: false
    temperature: 0.0
    top_p: 1.0
    max_tokens: 2048
    max_videos_per_request: 8
    max_video_frames_per_request: 512
    video_mode: video_url
    timeout_sec: 120
    max_retries: 2
  glm53_flash_optimizer:
    type: api_vlm
    provider: bigmodel
    model_name: glm-5.3-flash
    api_base: https://open.bigmodel.cn/api/paas/v4
    api_key: BIGMODEL_API_KEY
    reasoning_effort: high
    temperature: 1.0
    top_p: 0.95
    max_tokens: 16384
    timeout_sec: 600
    max_retries: 2
  deepseek_judge_fixed:
    type: api_llm
    provider: deepseek
    model_name: deepseek-v4-flash
    api_base: https://api.deepseek.com
    api_key: DEEPSEEK_API_KEY
    enable_thinking: false
    temperature: 0.0
    top_p: 0.95
    max_tokens: 8192
    timeout_sec: 300
    max_retries: 2
agents:
  global_agent:
    model:
      model_type: qwen3_5_35b_a3b_local
    max_steps: 5
    max_videos_per_watch: 4
    skill:
      enabled: false
  video_agent:
    planner:
      model_type: qwen3_5_35b_a3b_local
    observer:
      model_type: qwen3_5_35b_a3b_local
    max_steps: 5
    max_ranges_per_action: 8
    skill:
      enabled: false
