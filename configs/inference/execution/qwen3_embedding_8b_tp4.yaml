# Native vLLM serve config. CUDA_VISIBLE_DEVICES=4,5,6,7; do not use GPU0/1.
# Start after Actor services; require measured free memory on all four cards.
model: /home/kww/models/Qwen3-Embedding/Qwen3-Embedding-8B
served-model-name: qwen3_embedding_8b
host: 127.0.0.1
port: 8110
runner: pooling
